<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Decoy · Still building</title>
<meta name="description" content="Decoy is still being built, one brick at a time. Join the waitlist.">
<link rel="icon" href="img/icon.png">
<style>
  :root { --ink: #000; --paper: #fff; --soft: rgba(0,0,0,.55); --line: rgba(0,0,0,.14); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Apple SD Gothic Neo", "Hiragino Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :lang(ko) body, body:lang(ko) { word-break: keep-all; }
  .page { min-height: 100svh; display: flex; flex-direction: column; max-width: 1080px; margin: 0 auto;
          padding: 0 max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left)); }

  header { display: flex; align-items: center; justify-content: space-between; height: 60px; padding-top: env(safe-area-inset-top); }
  .brand { font-weight: 600; font-size: 19px; letter-spacing: -0.02em; }
  .lang { position: relative; }
  .lang select { font: inherit; font-size: 15px; color: var(--ink); background: transparent; border: 0; padding: 8px 22px 8px 8px; margin-right: -4px;
                 -webkit-appearance: none; appearance: none; cursor: pointer; }
  .lang::after { content: ""; position: absolute; right: 2px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
                 border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: rotate(45deg); pointer-events: none; }

  main { flex: 1; display: grid; gap: 8px; align-content: start; }
  figure { margin: 0; }
  .model { display: block; width: 100%; aspect-ratio: 1; border: 0; padding: 0; background: var(--paper); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .model img { width: 100%; height: 100%; object-fit: contain; display: block; transition: opacity .25s; }
  .model img.out { opacity: 0; }
  figcaption { display: flex; justify-content: space-between; font-size: 13px; color: var(--soft); padding: 2px 2px 0; }

  .copy { padding: 20px 0 8px; }
  h1 { font: 700 40px/1.08 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Apple SD Gothic Neo", "Hiragino Sans", sans-serif;
       letter-spacing: -0.035em; margin: 0; }
  .lead { margin: 12px 0 28px; color: var(--soft); max-width: 30em; }

  form { display: grid; gap: 10px; max-width: 440px; }
  .field { font: inherit; color: var(--ink); width: 100%; height: 52px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper);
           outline: none; -webkit-appearance: none; appearance: none; }
  .field::placeholder { color: rgba(0,0,0,.55); }
  .field:focus { border-color: var(--ink); }
  .go { font: inherit; font-weight: 600; height: 52px; border: 0; border-radius: 12px; background: var(--ink); color: var(--paper); cursor: pointer; }
  .go:active { opacity: .8; } .go:disabled { opacity: .4; cursor: default; }
  .agree { display: flex; gap: 10px; align-items: flex-start; margin-top: 4px; font-size: 13px; line-height: 1.45; color: var(--soft); cursor: pointer; }
  .agree input { flex: 0 0 auto; width: 18px; height: 18px; margin: 0; accent-color: #000; }
  .agree a { color: inherit; }
  .msg { min-height: 1.4em; margin: 4px 0 0; font-size: 15px; font-weight: 500; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  footer { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--soft); padding: 40px 0 max(28px, env(safe-area-inset-bottom)); }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--ink); }
  footer span { margin-right: auto; }

  @media (min-width: 900px) {
    main { grid-template-columns: 1.15fr 1fr; gap: 56px; align-items: center; align-content: center; }
    h1 { font-size: 56px; }
    .copy { padding: 0; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand">Decoy</div>
    <label class="lang">
      <span class="sr">Language</span>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
      </select>
    </label>
  </header>

  <main>
    <figure>
      <button class="model" id="model" type="button" aria-label="Show another build"><img id="model-img" src="img/duck.webp" alt="" width="696" height="696"></button>
      <figcaption><span id="model-name">Mallard</span><span id="model-count">1 / 8</span></figcaption>
    </figure>

    <section class="copy">
      <h1 data-t="title">Still building.</h1>
      <p class="lead" data-t="lead">We're stacking the last few bricks. Join the waitlist and we'll email you once Decoy is ready for iPhone.</p>

      <form id="wait" novalidate>
        <label for="w-email" class="sr" data-t="emailLabel">Email</label>
        <input class="field" id="w-email" type="email" name="email" autocomplete="email" inputmode="email" required maxlength="254" placeholder="Email address" data-ph="placeholder">
        <!-- 사람은 보지 못하는 칸: 채워져 있으면 자동 입력으로 보고 저장하지 않는다 -->
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="go" type="submit" id="w-btn" data-t="button">Join the waitlist</button>
        <label class="agree"><input type="checkbox" id="w-agree" required> <span><span data-t="consent">Save my email for this one notice. It's deleted within 3 months after it's sent.</span> <a href="privacy.html" data-t="details">Privacy</a></span></label>
        <p class="msg" id="w-msg" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <span>© 2026 Decoy</span>
    <a href="privacy.html" data-t="privacy">Privacy</a>
    <a href="terms.html" data-t="terms">Terms</a>
  </footer>
</div>

<script>
(function () {
  var T = {
    en: {
      docTitle: "Decoy · Still building",
      title: "Still building.",
      lead: "We're stacking the last few bricks. Join the waitlist and we'll email you once Decoy is ready for iPhone.",
      emailLabel: "Email", placeholder: "Email address",
      button: "Join the waitlist",
      consent: "Save my email for this one notice. It's deleted within 3 months after it's sent.",
      details: "Privacy", privacy: "Privacy", terms: "Terms",
      invalid: "Please check your email address.",
      agree: "Please tick the box to agree.",
      sending: "Adding you…",
      done: "You're on the list. We'll let you know when it's built.",
      fail: "That didn't go through. Please try again.",
      models: ["Mallard", "Christmas tree", "Tuxedo cat", "Castle", "Frog", "Cake", "Lighthouse", "Robot"]
    },
    ko: {
      docTitle: "Decoy · 아직 짓는 중",
      title: "아직 짓는 중이에요.",
      lead: "마지막 블럭 몇 개를 쌓고 있어요. 대기 목록에 올려 두면 iPhone에 나오는 날 메일로 알려 드릴게요.",
      emailLabel: "이메일", placeholder: "이메일 주소",
      button: "대기 목록에 올리기",
      consent: "이 알림 한 번을 위해 이메일을 저장하는 데 동의해요. 보낸 뒤 3개월 안에 지워요.",
      details: "개인정보", privacy: "개인정보처리방침", terms: "이용약관",
      invalid: "이메일 주소를 확인해 주세요.",
      agree: "동의에 체크해 주세요.",
      sending: "올리는 중…",
      done: "대기 목록에 올렸어요. 다 지으면 알려 드릴게요.",
      fail: "지금은 올리지 못했어요. 다시 해 주세요.",
      models: ["청둥오리", "크리스마스 트리", "턱시도 고양이", "성", "개구리", "케이크", "등대", "로봇"]
    },
    ja: {
      docTitle: "Decoy · 組み立て中",
      title: "まだ組み立て中です。",
      lead: "最後のブロックを積んでいるところです。ウェイトリストに登録すると、iPhone版の公開日にメールでお知らせします。",
      emailLabel: "メール", placeholder: "メールアドレス",
      button: "ウェイトリストに登録",
      consent: "このお知らせのためにメールアドレスを保存することに同意します。送信後3か月以内に削除します。",
      details: "プライバシー", privacy: "プライバシー", terms: "利用規約",
      invalid: "メールアドレスをご確認ください。",
      agree: "同意にチェックしてください。",
      sending: "登録中…",
      done: "登録しました。完成したらお知らせします。",
      fail: "登録できませんでした。もう一度お試しください。",
      models: ["マガモ", "クリスマスツリー", "ハチワレ猫", "お城", "カエル", "ケーキ", "灯台", "ロボット"]
    }
  };
  var FILES = ["duck", "tree", "tuxedo", "castle", "frog", "cake", "lighthouse", "robot"];

  // 언어: 주소의 ?lang= → 전에 고른 것 → 영어
  var q = new URLSearchParams(location.search);
  var store = { get: function () { try { return localStorage.getItem("decoy.lang"); } catch (e) { return null; } },
                set: function (v) { try { localStorage.setItem("decoy.lang", v); } catch (e) {} } };
  var lang = [q.get("lang"), store.get(), "en"].filter(function (l) { return l && T[l]; })[0];
  var t = T[lang], idx = 0;
  var sel = document.getElementById("lang");

  function caption() {
    document.getElementById("model-name").textContent = t.models[idx];
    document.getElementById("model-count").textContent = (idx + 1) + " / " + FILES.length;
  }
  function apply(l) {
    lang = l; t = T[l]; sel.value = l;
    document.documentElement.lang = l;
    document.title = t.docTitle;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.getAttribute("data-t")]; });
    document.querySelectorAll("[data-ph]").forEach(function (el) { el.placeholder = t[el.getAttribute("data-ph")]; });
    document.getElementById("w-msg").textContent = "";
    caption();
  }
  sel.addEventListener("change", function () { apply(sel.value); store.set(sel.value); });
  apply(lang);

  // 모델을 누르면 다음 작품
  FILES.slice(1).forEach(function (f) { var i = new Image(); i.src = "img/" + f + ".webp"; });
  var img = document.getElementById("model-img");
  document.getElementById("model").addEventListener("click", function () {
    idx = (idx + 1) % FILES.length;
    img.classList.add("out");
    setTimeout(function () { img.src = "img/" + FILES[idx] + ".webp"; img.classList.remove("out"); caption(); }, 200);
  });

  // 대기 목록 신청 (공개용 키: 서버는 join_waitlist 함수로 넣기만 허용)
  var API = "https://dkoeulbfpwtxlfhounvq.supabase.co/rest/v1/rpc/join_waitlist";
  var KEY = "sb_publishable_Qyt-b42bhEJ3N9RSfNocdA_tkohPm7J";
  var source = (q.get("from") || q.get("utm_source") || "").replace(/[^\w.-]/g, "").slice(0, 64);
  var form = document.getElementById("wait"), email = document.getElementById("w-email"),
      agree = document.getElementById("w-agree"), btn = document.getElementById("w-btn"),
      msg = document.getElementById("w-msg");
  function say(s) { msg.textContent = s; }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = email.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) || v.length > 254) { say(t.invalid); email.focus(); return; }
    if (!agree.checked) { say(t.agree); return; }
    if (form.website.value) { form.reset(); say(t.done); return; }
    btn.disabled = true; say(t.sending);
    fetch(API, {
      method: "POST",
      headers: { "apikey": KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_email: v, p_lang: lang, p_source: source })
    }).then(function (r) {
      if (r.ok) { form.reset(); say(t.done); }
      else if (r.status === 400) { say(t.invalid); }
      else { say(t.fail); }
    }).catch(function () { say(t.fail); })
      .then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
